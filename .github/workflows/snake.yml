# Draws the animated "snake eats my contributions" graph in the 4ogtech navy/neon palette and publishes it
# to the `output` branch, which the README links to. Runs daily, on push, or manually.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#3B82F6&color_dots=#ebedf0,#dbeafe,#93c5fd,#3b82f6,#1e3a8a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#BA9CFF&color_dots=#161b22,#1a1a2e,#1e3a8a,#3b82f6,#ba9cff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
