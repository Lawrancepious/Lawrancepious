# Draws the animated "snake eats my contributions" graph in red and publishes it
# to the `output` branch, which the README links to. Runs daily, on push, or manually.
name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E63946&color_dots=#ebedf0,#ffccd1,#ff8f9a,#e63946,#9d0208
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF6B78&color_dots=#161b22,#4a0e15,#8b1523,#cc2034,#e63946

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
