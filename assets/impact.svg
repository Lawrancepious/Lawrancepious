<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190">
<defs>
  <linearGradient id="bar" x1="0" x2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#BA9CFF"/></linearGradient>
  <filter id="nglow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/>
    <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.73  0 0 0 0 0.61  0 0 0 0 1  0 0 0 .6 0"/>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .bgc { fill: #0A0420; stroke: #BA9CFF; stroke-opacity: .22; }
    .big { font: 800 40px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #BA9CFF; filter: url(#nglow); }
    .lab { font: 600 19px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #EFEDFD; }
    .sub { font: 400 14px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #A89DD8; }
    .card { animation: rise ease-out; }
    .fill { transform-box: fill-box; transform-origin: left; animation: grow ease-out; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    @keyframes grow { from { transform: scaleX(0) } to { transform: scaleX(1) } }
  </style>
</defs>
<g class="card" style="animation-duration:1.0s">
  <rect x="10" y="10" width="282" height="170" rx="18" class="bgc"/>
  <text x="36" y="70" class="big">500+</text>
  <text x="36" y="102" class="lab">contracts / day</text>
  <text x="36" y="126" class="sub">processed by agentic AI</text>
  <rect x="36" y="148" width="230" height="6" rx="3" fill="#1A1A2E"/>
  <rect x="36" y="148" width="230" height="6" rx="3" fill="url(#bar)" class="fill"
        style="animation-duration:1.60s"/>
</g><g class="card" style="animation-duration:1.3s">
  <rect x="307" y="10" width="282" height="170" rx="18" class="bgc"/>
  <text x="333" y="70" class="big">92%+</text>
  <text x="333" y="102" class="lab">extraction accuracy</text>
  <text x="333" y="126" class="sub">across 3+ routed LLMs</text>
  <rect x="333" y="148" width="230" height="6" rx="3" fill="#1A1A2E"/>
  <rect x="333" y="148" width="212" height="6" rx="3" fill="url(#bar)" class="fill"
        style="animation-duration:1.95s"/>
</g><g class="card" style="animation-duration:1.6s">
  <rect x="604" y="10" width="282" height="170" rx="18" class="bgc"/>
  <text x="630" y="70" class="big">&lt;300 ms</text>
  <text x="630" y="102" class="lab">API latency</text>
  <text x="630" y="126" class="sub">async FastAPI services</text>
  <rect x="630" y="148" width="230" height="6" rx="3" fill="#1A1A2E"/>
  <rect x="630" y="148" width="184" height="6" rx="3" fill="url(#bar)" class="fill"
        style="animation-duration:2.30s"/>
</g><g class="card" style="animation-duration:1.9s">
  <rect x="901" y="10" width="282" height="170" rx="18" class="bgc"/>
  <text x="927" y="70" class="big">99%+</text>
  <text x="927" y="102" class="lab">job completion</text>
  <text x="927" y="126" class="sub">with retries + circuit breakers</text>
  <rect x="927" y="148" width="230" height="6" rx="3" fill="#1A1A2E"/>
  <rect x="927" y="148" width="228" height="6" rx="3" fill="url(#bar)" class="fill"
        style="animation-duration:2.65s"/>
</g>
</svg>
