<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
<defs>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <style>
    .cap  { font: 700 13px Consolas,'Courier New',monospace; fill: #BA9CFF; letter-spacing: 2.5px; }
    .box  { fill: #0A0420; stroke: #BA9CFF; stroke-opacity: .25; }
    .step { animation: lit 3s ease-in-out infinite; }
    .step .box { animation: edge 3s ease-in-out infinite; animation-delay: inherit; }
    .ico  { font: 24px 'Segoe UI','Helvetica Neue',Arial,sans-serif; }
    .ttl  { font: 700 19px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #EFEDFD; }
    .sub  { font: 400 13.5px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #A89DD8; }
    .wire { stroke: #3B82F6; stroke-opacity: .7; stroke-width: 2; stroke-dasharray: 5 6; animation: flow 1s linear infinite; }
    .pkt  { fill: #BA9CFF; filter: url(#glow); animation: move 3s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -22 } }
    @keyframes move { 0% { transform: translateX(0); opacity: 0 } 10% { opacity: 1 } 35% { transform: translateX(var(--d)); opacity: 1 } 45%,100% { transform: translateX(var(--d)); opacity: 0 } }
    @keyframes edge { 0%,100% { stroke-opacity: .25 } 20% { stroke-opacity: .9 } }
    @keyframes lit  { 0%,100% { opacity: .92 } 20% { opacity: 1 } }
  </style>
</defs>
<text x="12" y="24" class="cap">AGENTIC CONTRACT PIPELINE · LANGCHAIN + LANGGRAPH</text>
<line x1="208" y1="105.0" x2="258" y2="105.0" class="wire"/><circle cx="208" cy="105.0" r="4.5" class="pkt" style="--d:50px;animation-delay:0.0s"/><line x1="454" y1="105.0" x2="504" y2="105.0" class="wire"/><circle cx="454" cy="105.0" r="4.5" class="pkt" style="--d:50px;animation-delay:0.6s"/><line x1="700" y1="105.0" x2="750" y2="105.0" class="wire"/><circle cx="700" cy="105.0" r="4.5" class="pkt" style="--d:50px;animation-delay:1.2s"/><line x1="946" y1="105.0" x2="996" y2="105.0" class="wire"/><circle cx="946" cy="105.0" r="4.5" class="pkt" style="--d:50px;animation-delay:1.8s"/>
<g class="step" style="animation-delay:0.0s">
  <rect x="12" y="46" width="196" height="118" rx="16" class="box"/>
  <text x="32" y="88" class="ico">📂</text>
  <text x="32" y="122" class="ttl">Google Drive</text>
  <text x="32" y="145" class="sub">300–500+ contracts/day</text>
</g><g class="step" style="animation-delay:0.6s">
  <rect x="258" y="46" width="196" height="118" rx="16" class="box"/>
  <text x="278" y="88" class="ico">🔍</text>
  <text x="278" y="122" class="ttl">OCR</text>
  <text x="278" y="145" class="sub">text + layout extraction</text>
</g><g class="step" style="animation-delay:1.2s">
  <rect x="504" y="46" width="196" height="118" rx="16" class="box"/>
  <text x="524" y="88" class="ico">🧠</text>
  <text x="524" y="122" class="ttl">LLM Router</text>
  <text x="524" y="145" class="sub">3+ models · fallback</text>
</g><g class="step" style="animation-delay:1.8s">
  <rect x="750" y="46" width="196" height="118" rx="16" class="box"/>
  <text x="770" y="88" class="ico">✅</text>
  <text x="770" y="122" class="ttl">Pydantic</text>
  <text x="770" y="145" class="sub">40+ fields validated</text>
</g><g class="step" style="animation-delay:2.4s">
  <rect x="996" y="46" width="196" height="118" rx="16" class="box"/>
  <text x="1016" y="88" class="ico">🗄️</text>
  <text x="1016" y="122" class="ttl">MongoDB</text>
  <text x="1016" y="145" class="sub">50+ attributes stored</text>
</g>
</svg>
