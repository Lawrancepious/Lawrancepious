<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0A0420"/><stop offset="1" stop-color="#030014"/>
  </linearGradient>
  <radialGradient id="orb" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#140B30"/><stop offset=".62" stop-color="#2A1A5E" stop-opacity=".9"/>
    <stop offset=".74" stop-color="#BA9CFF" stop-opacity=".28"/><stop offset="1" stop-color="#BA9CFF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="fade" cx=".5" cy=".5" r=".6">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="gridmask"><rect width="1200" height="340" fill="url(#fade)"/></mask>
  <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
    <path d="M56 0H0V56" fill="none" stroke="#BA9CFF" stroke-opacity=".16" stroke-width="1"/>
    <animateTransform attributeName="patternTransform" type="translate" values="0 0;56 56" dur="8s" repeatCount="indefinite"/>
  </pattern>
  <linearGradient id="sweep" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="tglow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="10" result="b"/><feColorMatrix in="b" type="matrix" values="0 0 0 0 0.73  0 0 0 0 0.61  0 0 0 0 1  0 0 0 .55 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="card"><rect width="1200" height="340" rx="24"/></clipPath>
  <style>
    .eyebrow { font: 700 14px Consolas,'Courier New',monospace; fill: #BA9CFF; letter-spacing: 3px; animation: rise .9s ease-out; }
    .hi    { font: 600 24px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #A89DD8; animation: rise 1s ease-out; }
    .name  { font: 800 60px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #EFEDFD; animation: rise 1.2s ease-out; }
    .role  { font: 400 22px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #A89DD8; animation: rise 1.5s ease-out; }
    .role tspan { fill: #BA9CFF; }
    .chip  { animation: rise 1.8s ease-out; }
    .chip rect { fill: #0A0420; stroke: #BA9CFF; stroke-opacity: .45; }
    .chip text { font: 600 15px 'Segoe UI','Helvetica Neue',Arial,sans-serif; fill: #EFEDFD; }
    .live  { fill: #22C55E; animation: blinkdot 1.6s ease-in-out infinite; }
    .edge  { stroke: #BA9CFF; stroke-opacity: .35; stroke-width: 1.3; stroke-dasharray: 6 10; animation: flow 3s linear infinite; }
    .edge.b { stroke: #3B82F6; stroke-opacity: .6; }
    .node  { fill: #EFEDFD; filter: url(#glow); transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .orb   { transform-box: fill-box; transform-origin: center; animation: breathe 6s ease-in-out infinite; }
    .sweep { animation: sweep 7s ease-in-out infinite; }
    @keyframes rise     { from { opacity: 0; transform: translateY(16px) } to { opacity: 1; transform: none } }
    @keyframes flow     { to { stroke-dashoffset: -32 } }
    @keyframes pulse    { 0%,100% { transform: scale(.75); opacity: .75 } 50% { transform: scale(1.15); opacity: 1 } }
    @keyframes breathe  { 0%,100% { transform: scale(.94); opacity: .85 } 50% { transform: scale(1.04); opacity: 1 } }
    @keyframes sweep    { 0% { transform: translateX(-500px) } 60%,100% { transform: translateX(1600px) } }
    @keyframes blinkdot { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  </style>
</defs>
<g clip-path="url(#card)">
  <rect width="1200" height="340" fill="url(#bg)"/>
  <rect width="1200" height="340" fill="url(#grid)" mask="url(#gridmask)"/>
  <circle class="orb" cx="960" cy="170" r="250" fill="url(#orb)"/>
  <g transform="translate(800 30)"><line x1="0" y1="40" x2="110" y2="20" class="edge b" style="animation-delay:-0.00s"/><line x1="0" y1="40" x2="110" y2="80" class="edge" style="animation-delay:-0.37s"/><line x1="0" y1="40" x2="110" y2="140" class="edge" style="animation-delay:-0.74s"/><line x1="0" y1="40" x2="110" y2="200" class="edge b" style="animation-delay:-1.11s"/><line x1="0" y1="40" x2="110" y2="260" class="edge" style="animation-delay:-1.48s"/><line x1="0" y1="105" x2="110" y2="20" class="edge" style="animation-delay:-1.85s"/><line x1="0" y1="105" x2="110" y2="80" class="edge b" style="animation-delay:-2.22s"/><line x1="0" y1="105" x2="110" y2="140" class="edge" style="animation-delay:-2.59s"/><line x1="0" y1="105" x2="110" y2="200" class="edge" style="animation-delay:-2.96s"/><line x1="0" y1="105" x2="110" y2="260" class="edge b" style="animation-delay:-0.33s"/><line x1="0" y1="170" x2="110" y2="20" class="edge" style="animation-delay:-0.70s"/><line x1="0" y1="170" x2="110" y2="80" class="edge" style="animation-delay:-1.07s"/><line x1="0" y1="170" x2="110" y2="140" class="edge b" style="animation-delay:-1.44s"/><line x1="0" y1="170" x2="110" y2="200" class="edge" style="animation-delay:-1.81s"/><line x1="0" y1="170" x2="110" y2="260" class="edge" style="animation-delay:-2.18s"/><line x1="0" y1="235" x2="110" y2="20" class="edge b" style="animation-delay:-2.55s"/><line x1="0" y1="235" x2="110" y2="80" class="edge" style="animation-delay:-2.92s"/><line x1="0" y1="235" x2="110" y2="140" class="edge" style="animation-delay:-0.29s"/><line x1="0" y1="235" x2="110" y2="200" class="edge b" style="animation-delay:-0.66s"/><line x1="0" y1="235" x2="110" y2="260" class="edge" style="animation-delay:-1.03s"/><line x1="110" y1="20" x2="220" y2="75" class="edge" style="animation-delay:-1.40s"/><line x1="110" y1="20" x2="220" y2="140" class="edge b" style="animation-delay:-1.77s"/><line x1="110" y1="20" x2="220" y2="205" class="edge" style="animation-delay:-2.14s"/><line x1="110" y1="80" x2="220" y2="75" class="edge" style="animation-delay:-2.51s"/><line x1="110" y1="80" x2="220" y2="140" class="edge b" style="animation-delay:-2.88s"/><line x1="110" y1="80" x2="220" y2="205" class="edge" style="animation-delay:-0.25s"/><line x1="110" y1="140" x2="220" y2="75" class="edge" style="animation-delay:-0.62s"/><line x1="110" y1="140" x2="220" y2="140" class="edge b" style="animation-delay:-0.99s"/><line x1="110" y1="140" x2="220" y2="205" class="edge" style="animation-delay:-1.36s"/><line x1="110" y1="200" x2="220" y2="75" class="edge" style="animation-delay:-1.73s"/><line x1="110" y1="200" x2="220" y2="140" class="edge b" style="animation-delay:-2.10s"/><line x1="110" y1="200" x2="220" y2="205" class="edge" style="animation-delay:-2.47s"/><line x1="110" y1="260" x2="220" y2="75" class="edge" style="animation-delay:-2.84s"/><line x1="110" y1="260" x2="220" y2="140" class="edge b" style="animation-delay:-0.21s"/><line x1="110" y1="260" x2="220" y2="205" class="edge" style="animation-delay:-0.58s"/><line x1="220" y1="75" x2="320" y2="140" class="edge" style="animation-delay:-0.95s"/><line x1="220" y1="140" x2="320" y2="140" class="edge b" style="animation-delay:-1.32s"/><line x1="220" y1="205" x2="320" y2="140" class="edge" style="animation-delay:-1.69s"/><circle cx="0" cy="40" r="8" class="node" style="animation-delay:-0.00s"/><circle cx="0" cy="105" r="8" class="node" style="animation-delay:-0.45s"/><circle cx="0" cy="170" r="8" class="node" style="animation-delay:-0.90s"/><circle cx="0" cy="235" r="8" class="node" style="animation-delay:-1.35s"/><circle cx="110" cy="20" r="8" class="node" style="animation-delay:-1.80s"/><circle cx="110" cy="80" r="8" class="node" style="animation-delay:-2.25s"/><circle cx="110" cy="140" r="8" class="node" style="animation-delay:-0.30s"/><circle cx="110" cy="200" r="8" class="node" style="animation-delay:-0.75s"/><circle cx="110" cy="260" r="8" class="node" style="animation-delay:-1.20s"/><circle cx="220" cy="75" r="8" class="node" style="animation-delay:-1.65s"/><circle cx="220" cy="140" r="8" class="node" style="animation-delay:-2.10s"/><circle cx="220" cy="205" r="8" class="node" style="animation-delay:-0.15s"/><circle cx="320" cy="140" r="8" class="node" style="animation-delay:-0.60s"/></g>
  <circle class="live" cx="78" cy="58" r="5"/>
  <text class="eyebrow" x="92" y="63">AI ENGINEER · GENAI · AGENTIC AI</text>
  <text class="hi" x="72" y="104">Hi there, I'm</text>
  <text class="name" x="68" y="168" filter="url(#tglow)">Lawrance Pious A</text>
  <text class="role" x="72" y="210">I build <tspan>production LLM systems</tspan> · Chennai, India</text>
  <g class="chip"><rect x="70" y="240" width="77" height="32" rx="16"/><text x="109" y="261" text-anchor="middle">Python</text></g><g class="chip"><rect x="157.2" y="240" width="105" height="32" rx="16"/><text x="210" y="261" text-anchor="middle">LangChain</text></g><g class="chip"><rect x="272.0" y="240" width="105" height="32" rx="16"/><text x="324" y="261" text-anchor="middle">LangGraph</text></g><g class="chip"><rect x="386.8" y="240" width="86" height="32" rx="16"/><text x="430" y="261" text-anchor="middle">FastAPI</text></g><g class="chip"><rect x="483.2" y="240" width="68" height="32" rx="16"/><text x="517" y="261" text-anchor="middle">Azure</text></g><g class="chip"><rect x="561.2" y="240" width="50" height="32" rx="16"/><text x="586" y="261" text-anchor="middle">AWS</text></g>
  <g transform="skewX(-18)"><rect class="sweep" width="320" height="340" fill="url(#sweep)"/></g>
</g>
<rect x=".5" y=".5" width="1199" height="339" rx="24" fill="none" stroke="#EFEDFD" stroke-opacity=".14"/>
</svg>
